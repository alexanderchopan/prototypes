<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>prototypes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000;
    --surface: #0f0f0f;
    --surface-hover: #161616;
    --border: #1f1f1f;
    --border-hover: #2e2e2e;
    --text: #fff;
    --text-secondary: #555;
    --text-muted: #333;
    --green: #22c55e;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  header {
    width: 100%;
    max-width: 480px;
    margin-bottom: 2rem;
  }
  .label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    max-width: 480px;
    width: 100%;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.15rem;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    background: var(--surface-hover);
    border-color: var(--border-hover);
  }
  .card:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }
  .card-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .card-tag.green { color: var(--green); }
  .card-title {
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.3;
    color: var(--text);
  }
  .arrow {
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s, transform 0.15s;
  }
</style>
</head>
<body>
  <header>
    <div class="label">alexanderchopan</div>
    <h1>prototypes</h1>
  </header>
  <div class="grid">
    <a href="https://alexanderchopan.github.io/grantr/prototype/grantr-prototype.html" class="card">
      <span class="card-tag green">eip-8141</span>
      <span class="card-title">grantr 8141 reference app</span>
      <span class="arrow">↗</span>
    </a>
    <a href="smartprofiles.html" class="card">
      <span class="card-tag">smartprofiles</span>
      <span class="card-title">consumer account manager</span>
      <span class="arrow">↗</span>
    </a>
    <a href="machines-consumer-desktop-web.html" class="card">
      <span class="card-tag">machines</span>
      <span class="card-title">consumer desktop web</span>
      <span class="arrow">↗</span>
    </a>
    <a href="machines-consumer-extension.html" class="card">
      <span class="card-tag">machines</span>
      <span class="card-title">consumer extension</span>
      <span class="arrow">↗</span>
    </a>
    <a href="machines-consumer-mobile.html" class="card">
      <span class="card-tag">machines</span>
      <span class="card-title">consumer mobile web</span>
      <span class="arrow">↗</span>
    </a>
    <a href="machines-corporate-accounts-desktop.html" class="card">
      <span class="card-tag">machines</span>
      <span class="card-title">corporate accounts desktop</span>
      <span class="arrow">↗</span>
    </a>
  </div>
</body>
</html>
